      <stop offset="0.9" stop-color="#59636e" stop-opacity="0.55"/><stop offset="1" stop-color="#59636e" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="go" cx="0.75" cy="0.92" r="0.42"><stop offset="0" stop-color="#bc4c00" stop-opacity="0.13"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.92" cy="0" r="0.45"><stop offset="0" stop-color="#0969da" stop-opacity="0.13"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
    <radialGradient id="gs"><stop offset="0" stop-color="#bc4c00" stop-opacity="0.42"/><stop offset="0.6" stop-color="#bc4c00" stop-opacity="0.1"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0"/></radialGradient>
    <linearGradient id="ab" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bc4c00"/><stop offset="1" stop-color="#e16f24"/></linearGradient>
