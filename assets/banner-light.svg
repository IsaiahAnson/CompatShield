      <stop offset="0.78" stop-color="#bc4c00"/><stop offset="1" stop-color="#bc4c00" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ground" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="1280" y2="0">
