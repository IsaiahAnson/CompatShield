    <g class="hit h2 hx"><circle class="fH" cx="1096.0" cy="103.4" r="3.2"/><path class="sH" d="M1094.9 96.5 L1093.9 89.6"/><path class="sH" d="M1099.6 97.5 L1103.3 91.5"/><path class="sH" d="M1102.6 101.2 L1109.3 99.0"/></g>
